<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aksoy Sitesi Yönetim Paneli</title>

    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- PWA: ana ekrana uygulama olarak eklenebilmesi için -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Aidat takibi, duyurular, talepler ve site iletişim bilgileri." />

    <!-- iOS manifest'i tam desteklemiyor; ana ekran ikonu ve tam ekran
         davranışı bu etiketlerle geliyor -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aksoy Sitesi" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
